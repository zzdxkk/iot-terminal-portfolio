<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif' viewBox='0 0 1000 330' role='img' aria-label='两套终端的数据链路'><text x='12' y='26' font-size='17' font-weight='700' fill='#1f6feb'>工程 A ｜ NB-IoT 环境采集终端</text><text x='12' y='48' font-size='11.5' fill='#5c6675'>冷库 / 机柜 / 地下井盖等没有 Wi-Fi 的地方，靠运营商网络上报</text><rect x='12' y='62' width='176' height='64' rx='9' fill='#fff' stroke='#1f6feb' stroke-width='1.4'/><text x='100' y='87' font-size='12.5' text-anchor='middle' font-weight='600'>温湿度传感器</text><text x='100' y='107' font-size='10.5' text-anchor='middle' fill='#5c6675'>I2C 采样</text><rect x='208' y='62' width='190' height='64' rx='9' fill='#fff' stroke='#1f6feb' stroke-width='1.4'/><text x='303' y='87' font-size='12.5' text-anchor='middle' font-weight='600'>STM32L476 单片机</text><text x='303' y='107' font-size='10.5' text-anchor='middle' fill='#5c6675'>采样 · 缓存 · 调度</text><rect x='418' y='62' width='160' height='64' rx='9' fill='#fff' stroke='#1f6feb' stroke-width='1.4'/><text x='498' y='87' font-size='12.5' text-anchor='middle' font-weight='600'>BC95 通信模组</text><text x='498' y='107' font-size='10.5' text-anchor='middle' fill='#5c6675'>AT 指令</text><rect x='598' y='62' width='160' height='64' rx='9' fill='#fff' stroke='#1f6feb' stroke-width='1.4'/><text x='678' y='87' font-size='12.5' text-anchor='middle' font-weight='600'>运营商基站</text><text x='678' y='107' font-size='10.5' text-anchor='middle' fill='#5c6675'>NB-IoT 网络</text><rect x='778' y='62' width='150' height='64' rx='9' fill='#fff' stroke='#1f6feb' stroke-width='1.4'/><text x='853' y='87' font-size='12.5' text-anchor='middle' font-weight='600'>云平台</text><text x='853' y='107' font-size='10.5' text-anchor='middle' fill='#5c6675'>CoAP 收数 / 下发</text><g stroke='#1f6feb' stroke-width='1.4' fill='none' marker-end='url(#ar)'><line x1='188' y1='94' x2='204' y2='94'/><line x1='398' y1='94' x2='414' y2='94'/><line x1='578' y1='94' x2='594' y2='94'/><line x1='758' y1='94' x2='774' y2='94'/></g><text x='12' y='146' font-size='11' fill='#1f6feb'>断网先存本地 → 恢复后按序号补传 ｜ 参数双备份 + 校验 ｜ 失败 20/40/80/160/300 秒退避</text><text x='12' y='192' font-size='17' font-weight='700' fill='#0e8f52'>工程 B ｜ BLE 温湿度终端</text><text x='12' y='214' font-size='11.5' fill='#5c6675'>电池贴片，手机走近直接连，不需要网关、不需要配网</text><rect x='12' y='228' width='190' height='64' rx='9' fill='#fff' stroke='#0e8f52' stroke-width='1.4'/><text x='107' y='253' font-size='12.5' text-anchor='middle' font-weight='600'>温湿度传感器</text><text x='107' y='273' font-size='10.5' text-anchor='middle' fill='#5c6675'>I2C 采样</text><rect x='232' y='228' width='200' height='64' rx='9' fill='#fff' stroke='#0e8f52' stroke-width='1.4'/><text x='332' y='253' font-size='12.5' text-anchor='middle' font-weight='600'>nRF52840 蓝牙芯片</text><text x='332' y='273' font-size='10.5' text-anchor='middle' fill='#5c6675'>GATT 服务 · 通知</text><rect x='462' y='228' width='170' height='64' rx='9' fill='#fff' stroke='#0e8f52' stroke-width='1.4'/><text x='547' y='253' font-size='12.5' text-anchor='middle' font-weight='600'>手机 APP</text><text x='547' y='273' font-size='10.5' text-anchor='middle' fill='#5c6675'>读数据 / 改配置</text><rect x='662' y='228' width='120' height='64' rx='9' fill='#fff' stroke='#0e8f52' stroke-width='1.4'/><text x='722' y='253' font-size='12.5' text-anchor='middle' font-weight='600'>用户</text><text x='722' y='273' font-size='10.5' text-anchor='middle' fill='#5c6675'>走近即读</text><g stroke='#0e8f52' stroke-width='1.4' fill='none' marker-end='url(#ag)'><line x1='202' y1='260' x2='228' y2='260'/><line x1='432' y1='260' x2='458' y2='260'/><line x1='632' y1='260' x2='658' y2='260'/></g><text x='12' y='312' font-size='11' fill='#0e8f52'>一次最多传 185 字节（默认 23）｜ 配置分两包下发 ｜ 120 秒空闲自动断开 ｜ 重连自动恢复订阅</text><defs><marker id='ar' markerWidth='7' markerHeight='7' refX='6' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#1f6feb'/></marker><marker id='ag' markerWidth='7' markerHeight='7' refX='6' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#0e8f52'/></marker></defs></svg>